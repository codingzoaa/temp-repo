name: Daily market brief
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 07:15 KST, Tuesday-Saturday = 22:15 UTC, Monday-Friday.
    - cron: '15 22 * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: market-brief-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate collector
        run: |
          python3 -m unittest discover -s tests -v
          node tests/test_ui.cjs
      - name: Fetch free daily data
        run: python3 scripts/refresh_data.py
      - name: Assemble static site
        run: |
          mkdir -p public/data
          cp index.html style.css app.js public/
          cp data/market.json public/data/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
